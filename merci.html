<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — Cromwell &amp; Forbes</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-950: #050D14; --frost: #F4F7FA; --frost-dim: #C2CEDA; --frost-faint: #8DA0B3;
    --gold: #C8A96E; --gold-bright: #E3C98F; --line: rgba(200,169,110,0.22);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', system-ui, sans-serif; font-weight: 300;
    background: var(--ink-950) url('assets/hero-poster.jpg') center / cover no-repeat fixed;
    color: var(--frost); min-height: 100svh;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem; -webkit-font-smoothing: antialiased;
  }
  body::before { content: ''; position: fixed; inset: 0; background: rgba(5,13,20,0.82); }
  .card {
    position: relative; max-width: 34rem; text-align: center;
    background: rgba(7,19,30,0.85); border: 1px solid var(--line);
    border-radius: 14px; padding: 3rem 2.2rem;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    opacity: 1; transform: none;
    transition: opacity 600ms var(--ease-out), transform 600ms var(--ease-out);
    @starting-style { opacity: 0; transform: translateY(18px) scale(0.98); }
  }
  .check {
    width: 58px; height: 58px; margin: 0 auto 1.4rem; border-radius: 50%;
    border: 1px solid var(--gold); color: var(--gold); font-size: 1.6rem;
    display: flex; align-items: center; justify-content: center;
  }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 2rem; line-height: 1.15; }
  p { margin-top: 1rem; color: var(--frost-dim); font-size: 0.98rem; line-height: 1.65; }
  .btn {
    display: inline-block; margin-top: 1.8rem;
    background: linear-gradient(140deg, var(--gold-bright), var(--gold));
    color: var(--ink-950); border-radius: 8px; text-decoration: none;
    font-size: 0.88rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 0.85rem 1.6rem;
    transition: transform 160ms var(--ease-out);
  }
  .btn:active { transform: scale(0.97); }
  .alt { margin-top: 1.1rem; font-size: 0.85rem; color: var(--frost-faint); }
  .alt a { color: var(--gold-bright); text-decoration: none; }
  .en { margin-top: 1.6rem; padding-top: 1.4rem; border-top: 1px solid var(--line); font-size: 0.82rem; color: var(--frost-faint); }
</style>
<script src="tracking.js" defer></script>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1 id="t-title">Thank you — your request is in.</h1>
    <p id="t-body">The Cromwell &amp; Forbes team in Miami Beach has received your request. Your advisor will call you back shortly.</p>
    <p id="t-urgent">In a hurry? Write to us directly on WhatsApp.</p>
    <a class="btn" id="t-btn" href="https://wa.me/19542283601" rel="noopener">WhatsApp — quick reply</a>
    <p class="alt"><span id="t-or">or call</span> <a href="tel:+19542283601">+1 (954) 228-3601</a></p>
  </div>
<script>
(function () {
  // Même langue que la page d'accueil : ?lang= (posé à la redirection) ou mémoire cf-lang.
  var L = {
    fr: { html: 'fr', doc: 'Merci — Cromwell & Forbes',
      't-title': "Merci — c'est bien reçu.",
      't-body': "L'équipe Cromwell & Forbes à Miami Beach a bien reçu votre demande. Votre conseiller vous rappelle très vite.",
      't-urgent': 'Pressé ? Écrivez-nous directement sur WhatsApp.',
      't-btn': 'WhatsApp — réponse rapide',
      't-or': 'ou appelez le' },
    es: { html: 'es', doc: 'Gracias — Cromwell & Forbes',
      't-title': 'Gracias — solicitud recibida.',
      't-body': 'El equipo de Cromwell & Forbes en Miami Beach ha recibido su solicitud. Su asesor le llamará muy pronto.',
      't-urgent': '¿Tiene prisa? Escríbanos directamente por WhatsApp.',
      't-btn': 'WhatsApp — respuesta rápida',
      't-or': 'o llame al' }
  };
  var lang = null;
  try { lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('cf-lang'); } catch (e) {}
  var d = L[lang];
  if (!d) return; // anglais = version par défaut du HTML
  document.documentElement.lang = d.html;
  document.title = d.doc;
  for (var k in d) {
    if (k === 'html' || k === 'doc') continue;
    var n = document.getElementById(k);
    if (n) n.textContent = d[k];
  }
})();
</script>
</body>
</html>
